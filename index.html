<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Hub</title>
<style>
:root{--bg:#0d0b12;--panel:#18141f;--line:#342a3d;--text:#f7f1fa;--muted:#aaa0b1;--a:#b084ff;--b:#ff6eae}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#30203c,#0d0b12 48%)}
.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}header{display:flex;justify-content:space-between;gap:14px;margin-bottom:24px}h1{margin:0;font-size:31px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.add{width:42px;height:42px;border:1px solid #51415e;border-radius:14px;background:#211a29;color:#fff;font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.program{display:block;position:relative;text-decoration:none;color:inherit;background:linear-gradient(145deg,#1d1725,#141119);border:1px solid var(--line);border-radius:20px;padding:19px;min-height:125px}.program:active{transform:scale(.98)}
.icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b),var(--a));font-size:21px;margin-bottom:14px}.program h2{font-size:19px;margin:0 0 5px}.program p{font-size:12px;color:var(--muted);margin:0;word-break:break-word;padding-right:20px}
.menu{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;border-radius:10px;background:#2a2231;color:#bfb4c5;font-size:18px}.empty{border:1px dashed var(--line);border-radius:20px;padding:48px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:19px}.modal h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f0c13;color:#fff}.note{font-size:11px;color:var(--muted);margin-top:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}button{font:inherit;cursor:pointer}.cancel,.save{border:0;border-radius:11px;padding:10px 14px;color:#fff}.cancel{background:#28212e;border:1px solid var(--line)}.save{background:linear-gradient(135deg,var(--b),var(--a));font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>✦ Program Hub</h1><div class="sub">All your little HTML programs, in one place :3</div></div><button class="add" id="addBtn">＋</button></header>
<main id="grid" class="grid"></main>
</div>
<div class="overlay" id="overlay"><div class="modal">
<h2 id="modalTitle">Add program</h2>
<div class="field"><label>Program name</label><input id="name" placeholder="e.g. Heartline"></div>
<div class="field"><label>HTML link</label><input id="url" placeholder="https://... or Heartline.html"><div class="note">Paste the link to the program's GitHub Pages page.</div></div>
<div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Add program</button></div>
</div></div>
<script>
const KEY="program-hub-v1";let programs=JSON.parse(localStorage.getItem(KEY)||"[]"),editing=null;
function save(){localStorage.setItem(KEY,JSON.stringify(programs))}
function esc(s=""){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function icon(n){let x=["✦","♡","☼","◆","✧","★","⌁","☾","◈","✿"],v=0;for(let c of n)v+=c.charCodeAt(0);return x[v%x.length]}
function render(){let g=document.getElementById("grid");if(!programs.length){g.innerHTML='<div class="empty"><div style="font-size:32px">✦</div><div style="font-size:17px;color:#eee">No programs yet :3</div><div>Tap ＋ to add your first one.</div></div>';return}g.innerHTML=programs.map((p,i)=>'<a class="program" href="'+esc(p.url)+'"><button class="menu" onclick="event.preventDefault();event.stopPropagation();edit('+i+')">⋯</button><div class="icon">'+icon(p.name)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.url)+'</p></a>').join("")}
function openAdd(){editing=null;modalTitle.textContent="Add program";saveBtn.textContent="Add program";name.value="";url.value="";overlay.classList.add("show")}
function edit(i){editing=i;modalTitle.textContent="Edit program";saveBtn.textContent="Save changes";name.value=programs[i].name;url.value=programs[i].url;overlay.classList.add("show")}
function close(){overlay.classList.remove("show")}
addBtn.onclick=openAdd;cancel.onclick=close;saveBtn.onclick=()=>{let n=name.value.trim(),u=url.value.trim();if(!n||!u){alert("Please enter both a program name and a link.");return}if(editing===null)programs.push({name:n,url:u});else programs[editing]={name:n,url:u};save();close();render()};overlay.onclick=e=>{if(e.target===overlay)close()};render();
</script>
</body>
</html>
